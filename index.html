    //参数：模型，对话信息（可以配合构造函数Messages），其他参数
    function ChatRequestBuilder(model, messages, initialConfig = {}) {
      this.model = model
      this.messages = messages
      this.initialConfig = {
        ...initialConfig
      }
    }
    ChatRequestBuilder.prototype.toJSON = function() {
      let jsonData = {
        model: this.model,
        ...this.initialConfig
      }
      //判断messages是否有getMessages方法
      // 情况1：是的话调用getMessages方法

      if (typeof this.messages?.getMessages === 'function') {
        jsonData.messages = this.messages.getMessages()
      }
      // 情况2：如果是普通数组则直接加入
      else if (Array.isArray(this.messages) && this.messages !== null) {
        jsonData.messages = this.messages
      } else {
        throw new Error('bro,ChatRequestBuilder的第二个参数，你传的什么东西')
      }
      return JSON.stringify(jsonData)
    }

    //参数：请求体json，或对象
    ApiClient.prototype.send = async function(body) {
      try {
        //我本来只想判断一下是否为json的，但是热情ai直接把好的处理方式写完了。
        // 统一处理请求体
        let requestBody;

        // 情况1：如果传入的是已构建好的请求器实例
        if (typeof body?.toJSON === 'function') {
          requestBody = body.toJSON();
        }
        // 情况2：如果是普通对象则自动转换
        else if (typeof body === 'object' && body !== null) {
          requestBody = JSON.stringify(body);
        }
        // 情况3：如果已经是字符串则验证有效性
        else if (typeof body === 'string') {

            requestBody = body;
          } catch {
            throw new Error('字符串不是有效的JSON格式');
          }

        // 其他情况报错

        }
        //发送http请求
        const res = await fetch('https://api.deepseek.com/v1/chat/completions', {

            'Authorization': `Bearer ${this.apiKey}`
          },

        //返回数据
        return await res

      } catch (error) {
        alert('http请求错误')
        throw error
      }
    }

        //流式返回数据
        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ''
        let text = ''
        while (true) {
          const { done, value } = await reader.read();
          if (done) {
            // 处理最后可能残留的数据
            if (buffer.trim().length > 0) {
              processChunk(buffer);
            }
            break;
          }

          buffer += decoder.decode(value, { stream: true }); // 注意使用 stream: true

          // 使用更灵活的分隔符正则表达式
          const chunks = buffer.split(/(\r?\n){2}/);
          buffer = chunks.pop() || '';

          //
          chunks.forEach(rawChunk => {
            const cleanChunk = rawChunk.trim().replace(/^data: /, '');
            //总不能是空的吧
            if (!cleanChunk) return
            //如果结束了就结束
            if (cleanChunk === '[DONE]') {

            }

                text += obj.choices[0].delta.content
                //console.log(text)
              }
            } catch (e) {
              console.error('解析失败:', e.message, '原始数据:', cleanChunk);
            }
          });

          //回调函数,持续更新。
          fun(text)
        }

        //报错
      } catch (error) {
        alert('http请求错误')
        throw error
      }

  <script>
    class LocalArrayDB {
      constructor(type = 'requests') {
        this.dbName = 'ChatStreamDB';
        this.storeName = type; // 根据类型区分存储空间
        this.db = null;
        this.cache = []; // 内存缓存
      }

      // 初始化数据库
      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);

          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('requests')) {
              db.createObjectStore('requests', { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains('chats')) {
              db.createObjectStore('chats', { keyPath: 'id', autoIncrement: true });
            }
          };

          request.onsuccess = async (event) => {
            this.db = event.target.result;
            await this._syncCache();
            resolve();
          };

          request.onerror = (event) => reject(event.target.error);
        });
      }

      // 获取全部数据（返回解析后的JSON数组）
      async getAll() {
        await this._syncCache();
        return this.cache.map(str => JSON.parse(str));
      }

      // 添加数据（支持对象或JSON字符串）
      async push(item) {
        const jsonStr = typeof item === 'string' ? item : JSON.stringify(item);
        await this._addToDB(jsonStr);
        this.cache.push(jsonStr);
      }

      // 删除最后一条数据
      async pop() {
        if (this.cache.length === 0) return null;
        const lastItem = this.cache.pop();
        await this._removeLastFromDB();
        return JSON.parse(lastItem);
      }

      // 类似数组的splice方法
      async splice(start, deleteCount, ...items) {
        // 获取要插入的JSON字符串
        const insertItems = items.map(item =>
          typeof item === 'string' ? item : JSON.stringify(item)
        );

        // 内存操作
        const deleted = this.cache.splice(start, deleteCount, ...insertItems);

        // 数据库同步
        await this._rebuildDB();
        return deleted.map(str => JSON.parse(str));
      }

      // 更新指定位置数据
      async update(index, newItem) {
        if (index < 0 || index >= this.cache.length) throw new Error('索引越界');

        // 将新数据转换为 JSON 字符串
        const jsonStr = typeof newItem === 'string' ? newItem : JSON.stringify(newItem);

        // 更新内存缓存
        this.cache[index] = jsonStr;

        // 同步到数据库
        const transaction = this.db.transaction(this.storeName, 'readwrite');
        const store = transaction.objectStore(this.storeName);
        const request = store.openCursor();
        let currentIndex = 0;

        await new Promise((resolve, reject) => {
          request.onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor) {
              if (currentIndex === index) {
                // 更新当前记录
                const updateRequest = cursor.update({ id: cursor.key, data: jsonStr });
                updateRequest.onsuccess = () => resolve();
                updateRequest.onerror = reject;
              } else {
                currentIndex++;
                cursor.continue();
              }
            } else {
              resolve(); // 如果没有找到对应的索引，直接返回
            }
          };
          request.onerror = reject;
        });
      }

      // 清空数据
      async clear() {
        this.cache = [];
        const transaction = this.db.transaction(this.storeName, 'readwrite');
        const store = transaction.objectStore(this.storeName);
        store.clear();
        await transaction.complete;
      }

      // 私有方法：同步内存缓存
      async _syncCache() {
        const transaction = this.db.transaction(this.storeName, 'readonly');
        const store = transaction.objectStore(this.storeName);
        const request = store.getAll();

        this.cache = await new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result.map(item => item.data));
          request.onerror = (e) => reject(e);
        });
      }

      // 私有方法：添加数据到数据库
      async _addToDB(data) {
        const transaction = this.db.transaction(this.storeName, 'readwrite');
        const store = transaction.objectStore(this.storeName);
        store.add({ data });
        await transaction.complete;
      }

      // 私有方法：删除最后一条数据库记录
      async _removeLastFromDB() {
        const transaction = this.db.transaction(this.storeName, 'readwrite');
        const store = transaction.objectStore(this.storeName);
        const request = store.openCursor(null, 'prev');

        await new Promise((resolve, reject) => {
          request.onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor) {
              cursor.delete();
              resolve();
            }
          };
          request.onerror = reject;
        });
      }

      // 私有方法：重建数据库（用于splice等复杂操作）
      async _rebuildDB() {
        const transaction = this.db.transaction(this.storeName, 'readwrite');
        const store = transaction.objectStore(this.storeName);

        // 清空现有数据
        store.clear();

        // 重新插入缓存数据
        this.cache.forEach(data => {
          store.add({ data });
        });

        await transaction.complete;
      }
    }

  <script>
    //节流函数
    function throttle(fn, t) {
      let timer = null
      return function() {
        if (!timer) {
          timer = setTimeout(function() {
            fn()
            timer = null
          }, t)
        }
      }
    }
    //一个一键创建dom元素，添加到页面，可选修改innerHTML，会返回dom元素的函数
    function createEl(tag, container, text = '') {
      //创建元素
      const element = document.createElement(tag)
      //如果text存在将它赋值给元素的innerHtml
      if (text) element.innerHTML = text
      //添加到需要的元素中
      container.appendChild(element)
      //返回元素
      return element
    }

    const data = new ChatRequestBuilder('deepseek-chat', messages, { temperature: 1.8, stream: true })
    const deepseekApiClient = new ApiClient(api.key)
    //本地存储方法 new new
    const chatArray = new LocalArrayDB('chats');
    //用户操作方法 new
    const chatList = new MsgListDB(chatArray)
    //初始化聊天、系统提示
    initializeChatSystem(indexDB)

    localApiKey()

    //默认聊天数据
    const defChatData = {
      systems: [{role:'system',content:'系统提示不需要回复'}],
      messages: []
    }
    //本地存储===================
    // 本地存储初始化模块

    // 立即执行的初始化流程 (IIFE + async)
    ;
    async function initializeChatSystem(index = 0) {
      try {
        // 1. 初始化数据库
        await chatArray.init();
        console.log('数据库初始化完成');
        // 2. 检查是否存在初始数据
        const data = await chatArray.getAll();

        if (data.length === 0) {
          // 3. 创建默认数据
          const defaultData = {

            hintData: {
              name: '第1条聊天'
            },
            ...defChatData
          };

          await chatArray.push(defaultData);
          console.log('已创建默认聊天记录');
        }

        // 4. 加载数据（默认加载第一条）
        await loadChatData(index);
        console.log('初始数据加载完成');
        // 5. 渲染聊天
        renderMessages(messages.messages)


      } catch (error) {
        console.error('初始化失败:', error);
        // 可以在这里添加用户提示（如弹窗）
        alert('系统初始化失败，请刷新页面或联系管理员');
      }
    }


    //根据index加载聊天数据,成功返回id,失败报错
    async function loadChatData(index = 0) {
      //获取聊天数据
      const chatData = await chatArray.getAll()
      //判断一下有没有
      if (!chatData[index]) throw new Error('该聊天信息不存在')

      //解构
      const { systems, messages: messagesData, hintData } = chatData[index]
      //将聊天数据加入messages
      messages.messages = messagesData
      messages.systems = systems
      messages.hintData = hintData

    }
    // 保存当前对话
    async function saveChat(index = 0) {
      try {
        // 获取当前 messages 和 systems
        const currentData = {
          messages: messages.messages,
          systems: messages.systems,
          hintData: messages.hintData
        };

        // 更新到数据库（假设第一条是当前对话）
        await chatArray.update(index, currentData);
        console.log('对话已保存');
      } catch (error) {
        console.error('保存失败:', error);
        // 可以在这里添加用户提示（如弹窗）
        alert('对话保存失败，请稍后重试');
      }
    }


    //古希腊掌管对话的神，处理了点下提交按钮后的对话，显示，存储逻辑，极为混乱
    //=====================================
    function sendMessage() {
      // 获取列表元素
      const list = document.querySelector('.list')
      // 获取文本框
      let input = document.querySelector('.box .input')
      // 获取文本框的值
      const value = input.value
      // 清空文本框
      input.value = ''
      // 判断文本框内容是否为空
      if (!value) return alert('输入不能为空')

      // 用户聊天记录的模板字符串
      const userEl = `<div>${converter.render(value)}</div>`
      // 创建一个包含模板字符串的元素，添加到页面中，并添加类名
      const user = createEl('li', list, userEl)
      user.classList.add('user')

      // 创建一个元素用于装载助手的回复
      const assistant = createEl('li', list, input.value)
      const assistEl = createEl('div', assistant)
      // 添加一个动画类名
      assistEl.classList.add('typing')


      // 将用户的消息推入消息数组
      messages.Mpush('user', value)

      // 发送请求并处理返回的数据
      deepseekApiClient.strSend(data.toJSON(), (text) => {
        // 处理数据并加入页面中
        assistEl.innerHTML = converter.render(text)
      }, (text) => {
        // 更新助手回复的内容
        assistEl.innerHTML = converter.render(text)
        // 移除动画类名
        assistEl.classList.remove('typing')
        // 将助手的回复推入消息数组
        messages.Mpush('assistant', text)
        // 保存所有聊天记录
        saveChat(indexDB)
      })
    }

    //绑定一个点击事件
    document.querySelector('.box .btn').addEventListener('click', () => {
      //发送消息
      sendMessage()
    })

    //绑定一个回车事件
    document.querySelector('.box .input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        //发送消息
        sendMessage()
      }
    })

    //读取DB里的聊天数据添加到页面中显示，以及操作方法
    function MsgListDB() {
      this.ArrayDB = chatArray
    }
    //把数据显示到页面中
    MsgListDB.prototype.attachListUI = async function(mustSelect = false) {
      //先获得列表数据
      const arrList = await this.getChatList()
      //在页面中新建一个dialog
      const dialog = createEl('dialog', document.body)
      dialog.classList.add('chatList')
      //创建其内需要的元素
      const p = createEl('p', dialog, '聊天列表(点此关闭)')
      const ul = createEl('ul', dialog, arrList)
      const div = createEl('div', dialog)
      //判断是否为必须选择模式
      if (mustSelect) {
        p.innerHTML = '聊天列表(必须选择)'
      }
      //给p添加关闭方法
      p.addEventListener('click', () => {
        //判断是否为必须选择模式。如果是则不能退出。
        if (mustSelect) return
        dialog.remove()
      })
      //给div内部添加'增加'按钮
      const addChatBtn = createEl('button', div, '增加')
      //给增加按钮，添加点击事件:增加
      addChatBtn.addEventListener('click', async () => {
        //用户输入聊天名称
        const name = prompt('请输入聊天名称')
        //不能为空
        if (name === null) { return } else if (!name) return alert('输入不能为空')
        //进行一个强劲的添加
        await this.ArrayDB.push({
          hintData: { name: name },
          ...defChatData
        })
        //刷新一下列表
        ul.innerHTML = await this.getChatList()
      })
      //最后最重磅的一步，给ul添加事件委托。
      ul.addEventListener('click', function(e) {
        if (e.target.tagName === 'LI') {
          indexDB = +e.target.dataset.id
          initializeChatSystem(indexDB)
          //判断一下是否为必须选择模式，如果是则删除dialog。
          if (mustSelect) { dialog.remove() }
        }
      })
      //打开它
      dialog.showModal()

    }
    MsgListDB.prototype.getChatList = async function() {
      //处理一下获取来的数据
      const list = await this.ArrayDB.getAll()
      //处理成字符串
      const arrList = list.map((arr, index) => {
        return `
        <li data-id="${index}">${arr.hintData.name ? arr.hintData.name : '没有设置'}</li>
        `
      }).join('')
      //返回结果
      return arrList
    }
    //删除第条indexDB聊天
    MsgListDB.prototype.removeIndexDB = async function() {
      if (confirm(`是否删除数据${indexDB}（第${indexDB + 1}条）`)) {
        //删除
        chatArray.splice(indexDB, 1);
        //显示选项
        this.attachListUI(true)
        //刷新页面
        //initializeChatSystem()
        //刷新聊天
        //renderMessages(messages.messages) 
      }
    }
  </script>
