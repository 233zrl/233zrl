<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pianren AIChat</title>
  <link rel="icon" href="./icon/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="./css/style.css" type="text/css" media="all" />
  <link rel="stylesheet" href="./css/custom-dialog.css">
</head>

<body>
  <div class="title">Pianren AIChat</div>
  <nav class="nav">
    <div class="setBtn navBtn iconfont" data-action="settings">
      &#xe677;
      <ul class="setBtnList">
        <li><button data-action="add-prompt">添加提示词</button></li>
        <li><button data-action="set-prompt">管理提示词</button></li>
        <li><button data-action="clear-chat">清空该聊天</button></li>
        <li><button data-action="delete-chat">删除该聊天</button></li>
        <li><button data-action="edit-config">编辑可配置项</button></li>
        <li><button data-action="set-ApiKey">设置Api Key</button></li>
        <li><button onclick="app.ui.dialog.show({content:'没做，有事进QQ群联系 435761592'})">关于我们</button></li>
      </ul>
      <div class="overlay"></div>
    </div>
    <span class="navChatName"></span>
    <button class="toggleBtn navBtn" data-action="switch-chat">管理聊天</button>

    <!--<button class="dlData">下载聊天</button>-->
    <div
      style="font-size: 10px; position: absolute; bottom: calc(-2em * 1.5); background-color: rgba(255, 255, 255, 0);color: black;">
      (推荐谷歌、via、edge浏览器，禁止使用夸克浏览器，会出问题。) <br>
      设置deepseek的Api Key，点击右上角设置按钮，选择“设置Api Key”<br>
    </div>
  </nav>


  <!--显示-->
  <ul class="list">

  <!-- 底边栏 -->
  <div class="inputArea">
    <!-- 小按钮行 -->
    <div class="toolbar flex">
      <button class="left">不知道</button>
      <button class="add-chat" data-action="add-chat">新建对话</button>
      <button class="to-bottom iconfont" data-action="to-bottom">&#xe688;</button>
    </div>

    <!--输入行-->
    <div class="inputBox">
      <textarea type="text" class="input" placeholder="点击输入，使用 Ctrl + Enter 快捷发送。"></textarea>
      <!-- <input> -->
    </div>

    <!-- 快捷按钮行 -->
    <div class="quick-reply-box">
      <div class="absulute-to-right">
        <button class="quick-reply iconfont">&#xe633;</button>
        <button class="submit iconfont">&#xe67b;</button>
      </div>


    </div>
    <!-- 快捷输入列表 -->
    <div class="quick-reply-list-box" style="display: none;">
      <ul class="quick-reply-list">
        <li class="quick-reply-item">回复1</li>
        <li class="quick-reply-item">回复2</li>
        <li class="quick-reply-item">回复3</li>
      </ul>
    </div>
  </div>


  <!-- 上下文菜单 -->
  <dialog class="ContextMenu">
    <ul>
      <li data-action="undo">撤回</li>
      <li data-action="edit">编辑</li>
      <li data-action="copy">选择复制</li>
      <li data-action="copy-all">全文复制</li>
    </ul>
  </dialog>

  <script src="https://gcore.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/Utils.js"></script>
  <script src="./js/chatService.js"></script>
  <script src="./js/LocalArrayDB.js"></script>
  <!-- <script src="./js/listDB.js"></script> -->
  <script src="./js/UIController.js"></script>
  <script src="./js/ConfigManager.js"></script>
  <script src="./js/main.js"></script>


  <!-- 测试 -->
  <script src="./tests/Test.js"></script>
